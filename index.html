<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ブラスター・キッド</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  #screen {
    width: min(100vw, calc(100dvh * 960 / 576));
    aspect-ratio: 960 / 576;
    image-rendering: pixelated;
    background: #000;
    touch-action: none;
  }

  /* 画面ボタン(タッチ端末だけ表示) */
  #pad { display: none; }
  body.touch #pad {
    display: flex; position: fixed; left: 0; right: 0; bottom: 0;
    justify-content: space-between; align-items: flex-end;
    padding: 0 max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    pointer-events: none;
  }
  #pad > * { pointer-events: auto; }
  .btn {
    display: flex; align-items: center; justify-content: center;
    color: #fff; font: bold 18px sans-serif;
    background: rgba(255, 255, 255, 0.18); border: 3px solid rgba(255, 255, 255, 0.55);
    touch-action: none;
  }
  .btn.on { background: rgba(255, 255, 255, 0.5); }
  #dpad { width: 160px; height: 76px; border-radius: 16px; display: flex; }
  #dpad span { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 30px; }
  #dpad.l span:first-child, #dpad.r span:last-child { background: rgba(255, 255, 255, 0.45); border-radius: 12px; }
  .ab { display: flex; gap: 18px; align-items: flex-end; }
  .round { width: 80px; height: 80px; border-radius: 50%; }
  #jump { margin-bottom: 36px; background: rgba(60, 188, 252, 0.3); }
  #shoot { background: rgba(248, 184, 0, 0.3); }
  #pause { position: fixed; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); width: 48px; height: 40px; border-radius: 10px; font-size: 16px; }

  /* 縦持ち: ゲーム画面を上に寄せて、下の空きにボタン */
  #hint { display: none; position: fixed; top: 0; left: 0; right: 0; color: #aaa; font: 14px sans-serif; text-align: center; padding: 14px; }
  @media (orientation: portrait) {
    body.touch { align-items: flex-start; padding-top: 48px; }
    body.touch #hint { display: block; }
  }
  /* 横持ち: ゲーム画面を少し小さくして、左右の帯にボタンを置く */
  @media (orientation: landscape) {
    body.touch #screen { width: min(calc(100vw - 290px), calc(100dvh * 960 / 576)); }
    body.touch .round { width: 64px; height: 64px; }
    body.touch #dpad { width: 124px; height: 64px; }
    body.touch .ab { gap: 4px; }
    body.touch #jump { margin-bottom: 44px; }
    body.touch #pad { padding-left: max(10px, env(safe-area-inset-left)); padding-right: max(10px, env(safe-area-inset-right)); }
  }
</style>
</head>
<body>
<div id="hint">よこむきに すると あそびやすいよ</div>
<canvas id="screen"></canvas>
<div id="pad">
  <div id="dpad" class="btn"><span>◀</span><span>▶</span></div>
  <div class="ab">
    <div id="shoot" class="btn round" data-key="shoot">うつ</div>
    <div id="jump" class="btn round" data-key="jump">とぶ</div>
  </div>
  <div id="pause" class="btn" data-key="start">II</div>
</div>
<script src="js/sprites.js"></script>
<script src="js/level.js"></script>
<script src="js/game.js"></script>
<script src="js/touch.js"></script>
</body>
</html>
